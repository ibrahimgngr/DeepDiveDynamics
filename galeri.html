<!DOCTYPE html>

</head>

<body>

    <header>
        <div class="logo">

        </div>

        <div class="menu-toggle" id="mobile-menu">

        <nav id="nav-menu">
            <a href="index.html" data-tr='<i class="fa-solid fa-house"></i> ANA SAYFA'
                data-en='<i class="fa-solid fa-house"></i> HOME'><i class="fa-solid fa-house"></i> ANA SAYFA</a>
            <a href="araclar.html" data-tr="ARAÇLAR" data-en="VEHICLES">ARAÇLAR</a>
            <a href="hakkimizda.html" data-tr="HAKKIMIZDA" data-en="ABOUT US">HAKKIMIZDA</a>
            <a href="takimimiz.html" data-tr="TAKIMIMIZ" data-en="OUR TEAM">TAKIMIMIZ</a>
            <a href="raporlar.html" data-tr="RAPORLAR" data-en="PAPERS">RAPORLAR</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScR8scqBRYS02zoFpXVMVBQeoAkeAK_aq12Xqm8TAhwSs1n3A/viewform"
                target="_blank" data-tr="BİZE KATILIN" data-en="JOIN US">BİZE KATILIN</a>
            <a href="sponsorlar.html" data-tr="SPONSORLUK" data-en="SPONSORSHIP">SPONSORLUK</a>

            </a>
            <a href="#" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
        </nav>
    </header>

    <div class="page-wrapper">
        <section style="padding-top: 0; padding-bottom: 40px;">
            <h2 class="section-title" style="text-transform: capitalize;" data-tr="Galeri" data-en="Gallery">Galeri</h2>
            <p class="section-subtitle" style="margin-bottom: 10px;"
                data-tr="Çalışmalarımız sırasında çektiğimiz fotoğrafları inceleyerek yolculuğumuza eşlik edin"
                data-en="Accompany our journey by reviewing the photos we took during our works">Çalışmalarımız
                sırasında çektiğimiz fotoğrafları inceleyerek yolculuğumuza eşlik edin</p>

            <div class="gallery-grid">
                <img src="images/galeri/galeri0.jpeg" alt="Galeri 0" class="gallery-img">
                <img src="images/galeri/galeri1.jpeg" alt="Galeri 1" class="gallery-img">
                <img src="images/galeri/galeri2.jpeg" alt="Galeri 2" class="gallery-img">
                <img src="images/galeri/galeri3.jpeg" alt="Galeri 3" class="gallery-img">
                <img src="images/galeri/galeri4.jpeg" alt="Galeri 4" class="gallery-img">
                <img src="images/galeri/galeri5.jpeg" alt="Galeri 5" class="gallery-img">
                <img src="images/galeri/galeri6.jpeg" alt="Galeri 6" class="gallery-img">
                <img src="images/galeri/galeri7.jpeg" alt="Galeri 7" class="gallery-img">
                <img src="images/galeri/galeri8.jpeg" alt="Galeri 8" class="gallery-img">
                <img src="images/galeri/galeri9.jpeg" alt="Galeri 9" class="gallery-img">
                <img src="images/galeri/galeri10.jpeg" alt="Galeri 10" class="gallery-img">
                <img src="images/galeri/galeri11.jpeg" alt="Galeri 11" class="gallery-img">
                <video src="images/galeri/video1.mp4" class="gallery-video" muted loop autoplay playsinline></video>
            </div>
        </section>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" style="display: none;">
        <video class="lightbox-content" id="lightbox-video" controls style="display: none;"></video>
    </div>

    <!-- =========================================
         GERÇEK ZAMANLI ARAMA MODALI (PENCERESİ)
         ========================================= -->
    <div id="search-modal" class="search-modal">
        <span class="search-close"><i class="fa-solid fa-xmark"></i></span>
        <div class="search-modal-content">
            <input type="text" id="search-input" placeholder="Sitede ne arıyorsunuz? (örn: motor, rapor, sponsor...)"
                data-tr="Sitede ne arıyorsunuz?" data-en="What are you looking for?">
            <div id="search-results" class="search-results">
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-socials">
            <a href="https://www.instagram.com/deepdivedynamics/" target="_blank" aria-label="Instagram"><i
                    class="fa-brands fa-instagram"></i></a>
            <a href="https://www.linkedin.com/in/deep-dive-dynamics-aba6392b6/" target="_blank" aria-label="LinkedIn"><i
                    class="fa-brands fa-linkedin"></i></a>
        </div>
        <p>Copyright &copy; 2026 Deep Dive Dynamics</p>
    </footer>

    <script>
        window.addEventListener("load", () => {
            const preloader = document.getElementById("preloader");
            setTimeout(() => { preloader.style.opacity = "0"; preloader.style.visibility = "hidden"; }, 1000);
        });

        // Hamburger Menu
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        if (mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                const icon = mobileMenu.querySelector('i');
                if (navMenu.classList.contains('active')) {
                    icon.classList.remove('fa-bars'); icon.classList.add('fa-xmark');
                } else {
                    icon.classList.remove('fa-xmark'); icon.classList.add('fa-bars');
                }
            });
            navMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    mobileMenu.querySelector('i').classList.remove('fa-xmark');
                    mobileMenu.querySelector('i').classList.add('fa-bars');
                });
            });
        }

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxVideo = document.getElementById('lightbox-video');
        const closeBtn = document.querySelector('.lightbox-close');
        const galleryItems = document.querySelectorAll('.gallery-img, .gallery-video');

        galleryItems.forEach(item => {
            item.addEventListener('click', function () {
                lightbox.style.display = 'block';
                lightboxImg.style.display = 'none';
                lightboxVideo.style.display = 'none';
                if (this.tagName === 'IMG') {
                    lightboxImg.src = this.src;
                    lightboxImg.style.display = 'block';
                } else if (this.tagName === 'VIDEO') {
                    lightboxVideo.src = this.src || this.querySelector('source').src;
                    lightboxVideo.style.display = 'block';
                    lightboxVideo.play();
                }
            });
        });

        function closeLightbox() {
            lightbox.style.display = 'none';
            lightboxVideo.pause();
            lightboxVideo.currentTime = 0;
        }

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        // Multi Language
        const langToggle = document.getElementById('lang-toggle');
        const translatableElements = document.querySelectorAll('[data-tr]');
        let currentLang = localStorage.getItem('site_lang') || 'tr';
        applyLanguage(currentLang);

        if (langToggle) {
            langToggle.addEventListener('click', (e) => {
                e.preventDefault();
                currentLang = currentLang === 'tr' ? 'en' : 'tr';
                localStorage.setItem('site_lang', currentLang);
                applyLanguage(currentLang);
            });
        }

        function applyLanguage(lang) {
            if (lang === 'tr') {
                if (langToggle) langToggle.innerHTML = '<i class="fa-solid fa-globe"></i> EN';
            } else {
                if (langToggle) langToggle.innerHTML = '<i class="fa-solid fa-globe"></i> TR';
            }
            translatableElements.forEach(el => {
                const translation = el.getAttribute(`data-${lang}`);
                if (translation) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = translation;
                    else el.innerHTML = translation;
                }
            });
        }
         // =========================================
        // TÜM SİTEYİ VE ÇEVİRİLERİ TARAYAN AKILLI ARAMA MOTORU
        // =========================================
        const searchBtn = document.getElementById('search-btn');
        const searchModal = document.getElementById('search-modal');
        const searchClose = document.querySelector('.search-close');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        const sitePages = [
            'index.html', 'araclar.html', 'hakkimizda.html',
            'takimimiz.html', 'raporlar.html', 'galeri.html', 'sponsorlar.html'
        ];
        let siteCache = [];

        // 1. Arka planda sayfaları yükleme
        async function loadSiteData() {
            if (siteCache.length > 0) return;
            for (let url of sitePages) {
                try {
                    const response = await fetch(url);
                    const htmlText = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');

                    doc.querySelectorAll('script, style, nav, footer, #search-modal').forEach(el => el.remove());

                    siteCache.push({
                        url: url,
                        title: doc.title.split('|')[0].trim(),
                        dom: doc.body
                    });
                } catch (err) {
                    console.log(url + " yüklenirken hata oluştu.");
                }
            }
        }

        // Modalı Açma ve Kapatma
        if (searchBtn && searchModal) {
            searchBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                searchModal.classList.add('active');
                searchInput.focus();

                searchResults.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20px;"><i class="fa-solid fa-spinner fa-spin"></i> Site içerikleri taranıyor...</p>';
                await loadSiteData();
                searchResults.innerHTML = '';

                if (searchInput.value) triggerSearch(searchInput.value);
            });

            searchClose.addEventListener('click', () => {
                searchModal.classList.remove('active');
                searchInput.value = '';
                searchResults.innerHTML = '';
            });

            searchModal.addEventListener('click', (e) => {
                if (e.target === searchModal) {
                    searchModal.classList.remove('active');
                    searchInput.value = '';
                    searchResults.innerHTML = '';
                }
            });
        }

        // Arama İşlemi (ÇEVİRİ ETİKETLERİ DAHİL)
        function triggerSearch(query) {
            query = query.toLowerCase().trim();
            searchResults.innerHTML = '';
            if (query.length < 2) return;

            let resultsFound = 0;

            siteCache.forEach(page => {
                // Sadece metin barındıran etiketleri seç
                const elements = page.dom.querySelectorAll('h1, h2, h3, h4, h5, h6, p, a, span, li, button, strong, b, div.info-card');
                const uniqueSnippets = new Set();

                elements.forEach(el => {
                    if (el.closest('nav') || el.closest('#search-modal')) return;

                    // Hem HTML içindeki yazıyı hem de çeviri taglerini çek
                    let textContent = el.textContent || "";
                    let dataTr = el.getAttribute('data-tr') || "";
                    let dataEn = el.getAttribute('data-en') || "";

                    // Hepsini birleştirip arama havuzu oluştur
                    let fullString = (textContent + " " + dataTr + " " + dataEn).toLowerCase().replace(/\s+/g, ' ').trim();

                    if (fullString.includes(query) && fullString.length > 0) {

                        // Ekranda gösterilecek metni seç (Eğer İngilizce taginde bulduysa onu göster)
                        let matchSource = textContent;
                        if (dataEn.toLowerCase().includes(query)) matchSource = dataEn;
                        else if (dataTr.toLowerCase().includes(query)) matchSource = dataTr;

                        matchSource = matchSource.replace(/\s+/g, ' ').trim();

                        if (!uniqueSnippets.has(matchSource) && matchSource.length > 0) {
                            uniqueSnippets.add(matchSource);

                            const matchIndex = matchSource.toLowerCase().indexOf(query);
                            const start = Math.max(0, matchIndex - 35);
                            const end = Math.min(matchSource.length, matchIndex + query.length + 35);

                            let snippet = matchSource.substring(start, end);
                            if (start > 0) snippet = "..." + snippet;
                            if (end < matchSource.length) snippet = snippet + "...";

                            // Aranan kelimeyi parlat
                            const regex = new RegExp(`(${query})`, 'gi');
                            snippet = snippet.replace(regex, '<strong style="color: #000; background-color: var(--accent-color); padding: 0 4px; border-radius: 3px;">$1</strong>');

                            const resultItem = document.createElement('a');
                            resultItem.href = `${page.url}?q=${encodeURIComponent(query)}`;
                            resultItem.className = 'search-result-item';
                            resultItem.innerHTML = `
                                <h3 style="font-size:0.85rem; color:#fff; margin-bottom:8px; opacity:0.8; text-transform:uppercase; letter-spacing:1px;">
                                    <i class="fa-solid fa-file-lines" style="margin-right:8px; color:var(--accent-color);"></i>${page.title}
                                </h3>
                                <p style="line-height:1.6;">${snippet}</p>
                            `;
                            searchResults.appendChild(resultItem);
                            resultsFound++;
                        }
                    }
                });
            });

            if (resultsFound === 0) {
                searchResults.innerHTML = `<p style="color:var(--text-muted); text-align:center; margin-top:20px;">Tüm sitede "${query}" ile ilgili sonuç bulunamadı.</p>`;
            }
        }

        if (searchInput) {
            searchInput.addEventListener('input', function () {
                if (siteCache.length > 0) triggerSearch(this.value);
            });
        }

        // =========================================
        // SAYFA YÜKLENİNCE OTOMATİK KAYDIR VE PARLAT
        // =========================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q');

            if (searchQuery) {
                const query = searchQuery.toLowerCase().trim();
                const elements = document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, a, span, li, button, strong, b');
                let found = false;

                elements.forEach(el => {
                    if (found) return; // Zaten bulduysa diğerlerine bakma
                    if (el.closest('nav') || el.closest('#search-modal') || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;

                    let textContent = el.textContent || "";
                    let dataTr = el.getAttribute('data-tr') || "";
                    let dataEn = el.getAttribute('data-en') || "";

                    let fullString = (textContent + " " + dataTr + " " + dataEn).toLowerCase();

                    if (fullString.includes(query)) {
                        setTimeout(() => {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });

                            const originalBg = el.style.backgroundColor;
                            const originalTrans = el.style.transition;

                            el.style.transition = "background-color 0.5s ease";
                            el.style.backgroundColor = "rgba(0, 210, 255, 0.4)";
                            el.style.borderRadius = "4px";

                            setTimeout(() => {
                                el.style.backgroundColor = originalBg;
                                el.style.transition = originalTrans;
                                // URL'deki arama parametresini temizle
                                window.history.replaceState({}, document.title, window.location.pathname);
                            }, 2500);
                        }, 500);

                        found = true;
                    }
                });
            }
        });
    </script>
</body>

</html>
